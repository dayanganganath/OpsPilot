services:
  redis:
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:6382:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    working_dir: /app
    volumes:
      - .:/app
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      CELERY_BROKER_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    command:
      - celery
      - -A
      - config
      - worker
      - --loglevel=info
      - --concurrency=1

volumes:
  redis_data: